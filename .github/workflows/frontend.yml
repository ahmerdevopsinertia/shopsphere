name: ShopSphere Frontend CI/CD

env:
  VITE_API_BASE_URL: http://ec2-18-133-251-76.eu-west-2.compute.amazonaws.com:3000

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-frontend:
    name: Build Frontend
    environment: production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify production build
        run: |
          test -d dist
          test -f dist/index.html
          echo "Frontend production build verified successfully."

      - name: Show build output
        run: |
          echo "Build contents:"
          ls -lah dist

      - name: Test EC2 SSH connection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    run: |
      set -x

      echo "Creating SSH directory..."
      mkdir -p ~/.ssh

      echo "Writing SSH key..."
      printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/shopsphere-prod-key.pem

      echo "Setting permissions..."
      chmod 600 ~/.ssh/shopsphere-prod-key.pem

      echo "Testing key format..."
      ssh-keygen -l -f ~/.ssh/shopsphere-prod-key.pem

      echo "Adding EC2 host key..."
      ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      echo "Testing SSH..."
      ssh \
        -vvv \
        -i ~/.ssh/shopsphere-prod-key.pem \
        -o StrictHostKeyChecking=yes \
        "$EC2_USER@$EC2_HOST" \
        "echo 'SSH CONNECTION SUCCESSFUL'"

      echo "SSH test completed."