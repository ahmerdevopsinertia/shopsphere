name: ShopSphere CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# ---------------------------------------------------------
# Global environment
# ---------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ========================================================
  # BUILD + TEST + PUBLISH
  # ========================================================
  build-and-publish:

    runs-on: ubuntu-latest

    # Required for publishing to GHCR
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------------
      # Setup Node.js
      # -----------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # -----------------------------------------------------
      # Install dependencies
      # -----------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------
      # Lint
      # -----------------------------------------------------
      # - name: Run lint
      #   run: npm run lint

      # -----------------------------------------------------
      # Unit tests
      # -----------------------------------------------------
      # - name: Run tests
      #   run: npm run test

      # -----------------------------------------------------
      # Build NestJS application
      # -----------------------------------------------------
      - name: Build application
        run: npm run build

      # -----------------------------------------------------
      # Build Docker image
      # -----------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t shopsphere-backend:ci \
            .

      # -----------------------------------------------------
      # Create Docker network
      # -----------------------------------------------------
      - name: Create Docker network
        run: |
          docker network create shopsphere-ci

      # -----------------------------------------------------
      # Start PostgreSQL
      # -----------------------------------------------------
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name shopsphere-postgres-ci \
            --network shopsphere-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=12345 \
            -e POSTGRES_DB=shopsphere \
            postgres:16

      # -----------------------------------------------------
      # Wait for PostgreSQL
      # -----------------------------------------------------
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do

            if docker exec shopsphere-postgres-ci \
              pg_isready \
              -U postgres \
              -d shopsphere; then

              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready."

          echo "========== Docker Containers =========="
          docker ps -a

          echo "========== PostgreSQL Logs =========="
          docker logs shopsphere-postgres-ci

          exit 1

      # -----------------------------------------------------
      # Start ShopSphere
      # -----------------------------------------------------
      - name: Run ShopSphere container
        run: |
          docker run -d \
            --name shopsphere-backend-ci \
            --network shopsphere-ci \
            -p 3000:3000 \
            -e DATABASE_URL="postgresql://postgres:12345@shopsphere-postgres-ci:5432/shopsphere" \
            -e JWT_ACCESS_SECRET="ci-access-secret" \
            -e JWT_ACCESS_EXPIRES_IN="1d" \
            -e JWT_REFRESH_SECRET="ci-refresh-secret" \
            -e JWT_REFRESH_EXPIRES_IN="30d" \
            -e RUN_SEED="false" \
            shopsphere-backend:ci

      # -----------------------------------------------------
      # Wait for ShopSphere
      # -----------------------------------------------------
      - name: Wait for ShopSphere
        run: |
          for i in {1..30}; do

            if curl --silent --fail \
              http://localhost:3000/health > /dev/null; then

              echo "ShopSphere is healthy!"
              exit 0
            fi

            echo "Waiting for ShopSphere..."
            sleep 2
          done

          echo "ShopSphere failed to become healthy."

          echo "========== Docker Containers =========="
          docker ps -a

          echo "========== ShopSphere Logs =========="
          docker logs shopsphere-backend-ci

          echo "========== PostgreSQL Logs =========="
          docker logs shopsphere-postgres-ci

          exit 1

      # -----------------------------------------------------
      # Final health check
      # -----------------------------------------------------
      - name: Health check
        run: |
          curl --fail \
            http://localhost:3000/health

      # =====================================================
      # GHCR
      # =====================================================

      # -----------------------------------------------------
      # Login to GitHub Container Registry
      # -----------------------------------------------------
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------
      # Prepare Docker image metadata
      # -----------------------------------------------------
      - name: Prepare Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE_ID="${REGISTRY}/${IMAGE_NAME}"

          # GHCR requires lowercase image names
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      # -----------------------------------------------------
      # Tag Docker image
      # -----------------------------------------------------
      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
            shopsphere-backend:ci \
            "$IMAGE_ID:latest"

          docker tag \
            shopsphere-backend:ci \
            "$IMAGE_ID:${GITHUB_SHA}"

          echo "Docker images created:"
          docker images "$IMAGE_ID"

      # -----------------------------------------------------
      # Push Docker image to GHCR
      # -----------------------------------------------------
      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:${GITHUB_SHA}"

          echo "=========================================="
          echo "ShopSphere image published successfully!"
          echo "=========================================="
          echo "Latest:"
          echo "$IMAGE_ID:latest"
          echo ""
          echo "Commit:"
          echo "$IMAGE_ID:${GITHUB_SHA}"

      # =====================================================
      # DIAGNOSTICS
      # =====================================================

      # -----------------------------------------------------
      # Show ShopSphere logs
      # -----------------------------------------------------
      - name: Show ShopSphere logs
        if: always()
        run: |
          docker logs shopsphere-backend-ci || true

      # -----------------------------------------------------
      # Stop containers
      # -----------------------------------------------------
      - name: Stop Docker containers
        if: always()
        run: |
          docker stop shopsphere-backend-ci || true
          docker stop shopsphere-postgres-ci || true

      # -----------------------------------------------------
      # Cleanup
      # -----------------------------------------------------
      - name: Cleanup Docker resources
        if: always()
        run: |
          docker rm -f shopsphere-backend-ci || true
          docker rm -f shopsphere-postgres-ci || true
          docker network rm shopsphere-ci || true